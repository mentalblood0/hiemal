functions:
  assert equal::
    match: { constant: found }
    cases:
      - [{ constant: expected }, null]
      - - any
        - error:
            expected: { constant: expected }
            found: { constant: found }
compute:
  assert equal::
    expected: true
    found:
      match:
        match: { parse yaml: "[]" }
        as: _
        cases:
          - [number, _]
          - [string, _]
          - [any, null]
      cases:
        - [number, it's a number]
        - [string, it's a string]
        - ["null", true]
