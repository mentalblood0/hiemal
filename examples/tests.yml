                - - { array: number }
                  - map: _
                    as: element from matched
                    through:
                      sum: [{ constant: element from matched }, 1]
          expected: [it's a number, it's a string, it's a number, [2, 3, 4]]
      test numbers:
        assert equal::
          found:
            sum:
              - 1234
              - 1234.1234
              - "1234"
              - "1234.1234"
              - "12345678901234567890123456789012345678901234567890123456789012345678901234567890"
              - "12345678901234567890123456789012345678901234567890123456789012345678901234567.890"
              - "12345678901234567890123456789012345678901234567890123456789012345678901234567/890"
          expected: 687415888874985338887498533888749853388874985338887498533888749853388874985613459297/55625
      test recursive big:
        assert equal::
          found:
            functions:
              fibonacci 1::
                match:
                  is sorted: [_, 1]
                cases:
                  - [true, _]
                  - - false
                    - sum:
                        - fibonacci 2::
                            sum: [_, -1]
                        - fibonacci 3::
                            sum: [_, -2]
