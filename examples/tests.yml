constants:
  constructed regex:
    compile regex:
      - word boundary
      - group:
          - repeat: [word character]
            exactly: 13
        name: horror
      - word boundary
  raw regex:
    compile regex: \b\w{13}\b
compute:
  tests report::
    key-value pairs:
      test match sequence:
        assert equal::
          found:
            match:
              starting with: 1
              next: {sum: [_, 1]}
            cases:
              - [{array: number}, true]
              - [any, false]
          expected: true
