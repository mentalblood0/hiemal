      test from at value range from dynamic to dynamic out of range:
        assert equal::
          found:
            from:
              a: [1, 2, { b: 3 }, 4]
            at: [a, [{ sum: [-5, -10] }, { sum: [5, 10] }]]
          expected: [1, 2, { b: 3 }, 4]
      test from at function:
        assert equal::
          found:
            functions:
              fibonacci::
                from: examples/fibonacci.yml
                at: [functions, { object key: "fibonacci:" }]
            compute:
              fibonacci:: 10
          expected: 55
      test from at compute:
        assert equal::
          found:
