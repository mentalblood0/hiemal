functions:
  assert equal::
    match: { constant: found }
    cases:
      - [{ constant: expected }, ok]
      - - any
        - error:
            expected: { constant: expected }
            found: { constant: found }
compute:
  test map object:
    assert equal::
      found:
        map:
          key-value pairs: { first: 1, second: string, third: [1, 2, 3] }
        through:
          match: _
          as: matched
          cases:
            - [{ tuple: [string, number] }, it's a number]
            - [{ tuple: [string, string] }, it's a string]
            - - { tuple: [string, { array: number }] }
              - map: { from: { constant: matched }, at: [1] }
                as: element from matched
                through:
                  sum: [{ constant: element from matched }, 1]
      expected: [it's a number, it's a string, [2, 3, 4]]
  test map tuple and array:
    assert equal::
      found:
        map: [1, string, [1, 2, 3]]
        through:
          match: _
          as: matched
          cases:
            - [number, it's a number]
            - [string, it's a string]
            - - { array: number }
              - map: { constant: matched }
                as: element from matched
                through:
                  sum: [{ constant: element from matched }, 1]
      expected: [it's a number, it's a string, [2, 3, 4]]
  test numbers:
    assert equal::
      found:
        sum:
          - 1234
          - 1234.1234
          - "1234"
          - "1234.1234"
          - "12345678901234567890123456789012345678901234567890123456789012345678901234567890"
          - "12345678901234567890123456789012345678901234567890123456789012345678901234567.890"
          - "12345678901234567890123456789012345678901234567890123456789012345678901234567/890"
      expected: 687415888874985338887498533888749853388874985338887498533888749853388874985613459297/55625
  test recursive big:
    assert equal::
      found:
        functions:
          fibonacci 1::
            match:
              is sorted: [_, 1]
            cases:
              - [true, _]
              - - false
                - sum:
                    - fibonacci 2::
                        sum: [_, -1]
                    - fibonacci 3::
                        sum: [_, -2]
          fibonacci 2::
            match:
              is sorted: [_, 1]
            cases:
              - [true, _]
              - - false
                - sum:
                    - fibonacci 1::
                        sum: [_, -1]
                    - fibonacci 3::
                        sum: [_, -2]
          fibonacci 3::
            match:
              is sorted: [_, 1]
            cases:
              - [true, _]
              - - false
                - sum:
                    - fibonacci 1::
                        sum: [_, -1]
                    - fibonacci 2::
                        sum: [_, -2]
        compute:
          - fibonacci 1:: 10
          - fibonacci 2:: 10
          - fibonacci 3:: 10
      expected: [55, 55, 55]
  test recursive normal:
    assert equal::
      found:
        functions:
          fibonacci::
            match:
              is sorted: [_, 1]
            cases:
              - [true, _]
              - - false
                - sum:
                    - fibonacci::
                        sum: [_, -1]
                    - fibonacci::
                        sum: [_, -2]
        compute:
          fibonacci:: 10
      expected: 55
  test from at:
    assert equal::
      found:
        - functions:
            fibonacci::
              from: examples/fibonacci.yml
              at: [functions, { object key: "fibonacci:" }]
          compute:
            fibonacci:: 10
        - from: examples/fibonacci.yml
          at: [compute, { object key: "fibonacci:" }]
      expected: [55, 10]
  test heterogenous branching:
    assert equal::
      found:
        match: { is sorted: [1, 2, 3] }
        cases:
          - [true, 1]
          - [false, string]
      expected: 1
  test match by type refined branch:
    assert equal::
      found:
        match: { parse yaml: "0x1A" }
        cases:
          - [number, true]
          - [string, it's a string]
          - [any, it's something else]
      expected: true
  test match by type any branch:
    assert equal::
      found:
        match: { parse yaml: "[]" }
        cases:
          - [number, it's a number]
          - [string, it's a string]
          - [any, true]
      expected: true
  test match by type without any branch:
    assert equal::
      found:
        match:
          match: { parse yaml: "[]" }
          as: _
          cases:
            - [number, _]
            - [string, _]
            - [any, null]
        cases:
          - [number, it's a number]
          - [string, it's a string]
          - ["null", true]
      expected: true
  test match by value:
    assert equal::
      found:
        match: { parse yaml: "[1, 2, 3]" }
        cases:
          - [number, it's a number]
          - [string, it's a string]
          - [[1, { sum: [1, 1] }, 3], true]
          - [any, it's something else]
      expected: true
