functions:
  assert equal::
    match: found
    cases:
      - [{ constant: expected }, ok]
      - - any
        - error:
            expected: { constant: expected }
            found: { constant: found }
  tests report::
    match:
      filter: _
      through:
        match:
          from: _
          at: [1]
        cases:
          - [ok, false]
          - [{ object: { error: any } }, true]
    as: _
    cases:
      - [[], ok]
      - [any, _]
  is match::
    match:
      match regex:
        string: { constant: string }
        regex: { constant: regex }
    cases:
      - [null, false]
      - [any, true]
  match regex all::
    map:
      starting with:
        constants:
          match regex result:
            match regex:
              string: { constant: string }
              regex: { constant: regex }
        compute:
          match: match regex result
          cases:
            - [null, null]
            - - any
              - match regex result: { constant: match regex result }
                string: { constant: string }
      next:
        match: _
        as: previous
        cases:
          - [null, null]
          - - any
            - constants:
                previous end:
                  from: { constant: previous }
                  at: [match regex result, end]
              compute:
                constants:
                  string:
                    from: { constant: previous }
                    at:
                      - string
                      - - { constant: previous end }
                        - null
                compute:
                  constants:
                    match regex result:
                      match regex:
                        string: { constant: string }
                        regex: { constant: regex } 
                  compute:
                    match: match regex result
                    cases:
                      - [null, null]
                      - - any
                        - string: { constant: string }
                          match regex result:
                            groups:
                              from: { constant: match regex result }
                              at: [groups]
                            start:
                              sum:
                                - { constant: previous end }
                                - from: { constant: match regex result }
                                  at: [start]
                            end:
                              sum:
                                - { constant: previous end }
                                - from: { constant: match regex result }
                                  at: [end]
    through:
      match: _
      cases:
        - [null, null]
        - - any
          - from: _
            at: [match regex result]
constants:
  constructed regex:
    compile regex:
      - word boundary
      - group:
          - repeat: [word character]
            exactly: 13
        name: horror
      - word boundary
  raw regex:
    compile regex: \b\w{13}\b
compute:
  tests report::
    key-value pairs:
      test a:
        assert equal::
          found: { parse: { YAML: "false" } }
          expected: true
      test b:
        assert equal::
          found: { parse: { YAML: "true" } }
          expected: true
      test file metadata:
        assert equal::
          found:
            from: { file metadata: src/embedded_functions.yml }
            at: [ is file ]
          expected: true
      test glob:
        assert equal::
          found: { glob: src/*.yml }
          expected: [ src/embedded_functions.yml ]
      test sleep:
        assert equal::
          found: { sleep: 0.001 }
          expected: 0.001
      test loop:
        assert equal::
          found:
            starting with: 1
            loop: { sum: [_, 2] }
            while: { is sorted: [_, 5] }
          expected: 7
      test hash:
        assert equal::
          found:
            map:
              - SHA224
              - SHA256
              - SHA384
              - SHA512
              - SHA512/224
              - SHA512/256
              - XXH3_64
              - XXH3_128
              - BLAKE3
              - { GxHash32: 0 }
              - { GxHash64: 0 }
              - { GxHash128: 0 }
              - { XXH32: 0 }
              - { XXH64: 0 }
              - { BLAKE3 with size: 100 }
              - { BLAKE3 with key: { bytes from string: first 32 bytes only } }
              - { BLAKE3 derive key: some context }
            through:
              hash:
                algorithm: _
                data: { bytes from string: hello world }
          expected:
            - bytes: 2f05477fc24bb4faefd86517156dafdecec45b8ad3cf2522a563582b
            - bytes: b94d27b9934d3e08a52e52d7da7dabfac484efe37a5380ee9088f7ace2efcde9
            - bytes: fdbd8e75a67f29f701a4e040385e2e23986303ea10239211af907fcbb83578b3e417cb71ce646efd0819dd8c088de1bd
            - bytes: 309ecc489c12d6eb4cc40f50c902f2b4d0ed77ee511a7c7a9bcd3ca86d4cd86f989dd35bc5ff499670da34255b45b0cfd830e81f605dcf7dc5542e93ae9cd76f
            - bytes: 22e0d52336f64a998085078b05a6e37b26f8120f43bf4db4c43a64ee
            - bytes: 0ac561fac838104e3f2e4ad107b4bee3e938bf15f2b15f009ccccd61a913f017
            - bytes: d447b1ea40e6988b
            - bytes: df8d09e93f874900a99b8775cc15b6c7
            - bytes: d74981efa70a0c880b8d8c1985d075dbcbf679b99a5f9914e5aaf96b831a9e24
            - bytes: 79e41ef3
            - bytes: 2700ced979e41ef3
            - bytes: 253091e654891f5e2700ced979e41ef3
            - bytes: cebb6622
            - bytes: 45ab6734b21e6968
            - bytes: d74981efa70a0c880b8d8c1985d075dbcbf679b99a5f9914e5aaf96b831a9e24a020ed55aed9a6ab2eaf3fd70d2c98c949e142d8f42a10250190b699e02cf9eb68612e1a556fee6cf726bcb0994f7d3e669eda394788f8c80a4f0ea056be3d4dffd8069d
            - bytes: e5c1f826bb9c23f2bf25707566f49593a5f0f646fd3e2d8b1558de923608c8b9
            - bytes: 4fd11ce7b1bea157e56f8aa6939a78a015bf117765170b3f0e98d59ea38c9dba
      test encode to:
        constants:
          source: [1, 2, { lalala: null }, 3]
        compute:
          assert equal::
            found:
              parse:
                bincode:
                  encode to:
                    bincode: { constant: source }
            expected: { constant: source }
      test stringify to:
        constants:
          source: [1, 2, { lalala: null }, 3]
        compute:
          assert equal::
            found:
              parse:
                JSON:
                  stringify to:
                    JSON: { constant: source }
            expected: { constant: source }
      test sort:
        assert equal::
          found:
            sort: [2, 3, 1]
          expected: [1, 2, 3]
      test optimize pure literal-typed code:
        assert equal::
          found:
            pipe:
              - functions:
                  fibonacci::
                    from: examples/fibonacci.yml
                    at: [functions, { object key: "fibonacci:" }]
                compute:
                  fibonacci:: 1000 # attempt to compute will result in stack overflow
              - true
          expected: true
      test send request:
        assert equal::
          found:
            constants:
              client:
                HTTP client:
                  - error on bad status code: false
                  - proxy: false
            compute:
              from:
                send request:
                  client: { constant: client }
                  request:
                    URL: https://httpbingo.org/get
                    method: GET
                    body: null
                    parameters: []
              at: [ status ]
          expected: OK
      test run command:
        assert equal::
          found:
            run:
              command: echo
              arguments: [lalala]
          expected:
            exit code: 0
            standard output: { bytes from string: "lalala\n" }
            standard error: { bytes: "" }
      test from at inner:
        assert equal::
          found:
            - functions:
                f::
                  from: examples/fibonacci.yml
                  at: [functions, { object key: "fibonacci:" }]
              compute: 0
            - functions:
                fibonacci::
                  from: examples/tests.yml
                  at:
                    - compute
                    - { object key: "tests report:" }
                    - { embedded function call: key-value pairs }
                    - { object key: test from at inner}
                    - { object key: "assert equal:" }
                    - { object key: "found" }
                    - { array index: 0 }
                    - functions
                    - { object key: "f:" }
              compute:
                fibonacci:: 10
          expected: [0, 55]
      test sequence while:
        assert equal::
          found:
            starting with: 1
            next: { sum: [_, 2] }
            while: { is sorted: [_, 5] }
          expected: [1, 3, 5]
      test flatten lazy:
        assert equal::
          found:
            from:
              flatten:
                - [1, 2]
                - starting with: 1
                  next: { sum: [_, 1] }
            at: [[0, 5]]
          expected: [1, 2, 1, 2, 3]
      test try:
        assert equal::
          found:
            try:
              - read bytes:
                  source:
                    bufferized reader: tests.yml
                  amount: 1
              - read bytes:
                  source:
                    bufferized reader: nonexistent file
                  amount: 1
            or: false
          expected: false
      test heterogenous sequence:
        assert equal::
          found:
            from:
              starting with: [0, 1]
              next:
                - sum:
                    - from: _
                      at: [0]
                    - 1
                - match:
                    from: _
                    at: [1]
                  cases:
                    - [number, s]
                    - [string, 1]
            at: [[0, 4]]
          expected:
            - [0, 1]
            - [1, s]
            - [2, 1]
            - [3, s]
      test FizzBuzz:
        assert equal::
          found:
            from:
              map:
                starting with: 1
                next: { sum: [_, 1] }
              through:
                match:
                  mod: [_, 3]
                cases:
                  - - 0
                    - match:
                        mod: [_, 5]
                      cases:
                        - [0, FizzBuzz]
                        - [any, Fizz]
                  - - any
                    - match:
                        mod: [_, 5]
                      cases:
                        - [0, Buzz]
                        - [any, _]
            at: [[0, 20]]
          expected: [1, 2, Fizz, 4, Buzz, Fizz, 7, 8, Fizz, Buzz, 11, Fizz, 13, 14, FizzBuzz, 16, 17, Fizz, 19, Buzz]
      test exponentiate:
        assert equal::
          found:
            exponentiate:
              base: 4
              exponent: 1/2
              precision: 64
              max result denominator: 1000
          expected: 2
      test round:
        assert equal::
          found:
            round: 1.4
          expected: 1
      test divide:
        assert equal::
          found:
            divide: [20, 6]
          expected: 10/3
      test mod:
        assert equal::
          found:
            mod: [20, 6]
          expected: 2
      test match regex all:
        assert equal::
          found:
            from:
              match regex all::
                string: I categorically categorically deny having triskaidekaphobia.
                regex: { constant: constructed regex }
            at: [[0, 3]]
          expected:
            - groups:
                horror: categorically
              start: 2
              end: 15
            - groups:
                horror: categorically
              start: 16
              end: 29
            - null
      test lazy constant:
        assert equal::
          found:
            forbid:
              - read file
            compute:
              constants:
                _:
                  read bytes from file: p
              compute:
                null
          expected: null
      test from at string:
        assert equal::
          found:
            constants:
              _: abcd
            compute:
                from: _
                at: [[1, 3]]
          expected: bc
      test files:
        assert equal::
          found:
            allow:
              - error
              - create file
              - write file
              - read file
              - read filesystem
              - remove file
            compute:
              pipe:
                - write bytes:
                    target:
                      bufferized writer:
                        path: test files.txt
                        mode: create
                    content: { bytes: "6262" }
                - read bytes:
                    source:
                      bufferized reader: test files.txt
                    amount: 1
                - - _
                  - remove file: test files.txt
              as: _
          expected:
            - { bytes: "62" }
            - null
      test pipe lazy:
        assert equal::
          found:
            from:
              pipe:
                - starting with: 0
                  next: { sum: [_, 1] }
                - starting with: 0
                  next: { sum: [_, { from: { constant: input }, at: [10], default: 0 }] }
                - starting with: 0
                  next: { sum: [_, { from: { constant: input }, at: [10], default: 0 }] }
              as: input
            at: [1]
          expected: 100
      test pipe:
        assert equal::
          found:
            pipe:
              - { sum: [1, 2] }
              - { sum: [_, 3] }
              - { sum: [_, 4] }
            as: _
          expected: 10
      test user functions caching:
        assert equal::
          found:
            functions:
              f:: { constant: _ }
            compute:
              - constants: { x: 1 }
                compute: { f:: x }
              - constants: { x: 2 }
                compute: { f:: x }
          expected: [x, x]
      test from-at array requires handling default:
        assert equal::
          found:
            match: { parse: { YAML: "[1]" } }
            as: _
            cases:
              - - { array: number }
                - match:
                    from: _
                    at: [1]
                  cases:
                    - [number, false]
                    - [null, true]
              - [any, true]
          expected: true
      test match regex complex:
        assert equal::
          found:
            constants:
              log levels: [INFO, WARN, ERROR, DEBUG]
            compute:
              map:
                - 2026-08-10 14:23:45.123  INFO  auth_service - User login successful [user_id=12345]
                - 2026-08-10 14:24:01.456  ERROR  database.core - Connection timeout (ERR-502) [retry_count=3]
                - 2026-08-10 14:25:10.789  WARN  cache.redis - Memory usage high [threshold=85%]
                - 2026-08-10 14:26:30.012  DEBUG  api.v2.handler - Processing request [endpoint=/users]
                - 2026-08-10 14:27:15.678  ERROR  auth.service - ERROR invalid token (ERR-401) [user_id=abc123]
              through:
                match regex:
                  string: _
                  regex:
                    compile regex:
                      - start of string
                      - name: timestamp
                        group:
                          - { repeat: [digit], exactly: 4 }
                          - raw string: "-"
                          - { repeat: [digit], exactly: 2 }
                          - raw string: "-"
                          - { repeat: [digit], exactly: 2 }
                          - whitespace character
                          - { repeat: [digit], exactly: 2 }
                          - raw string: ":"
                          - { repeat: [digit], exactly: 2 }
                          - raw string: ":"
                          - { repeat: [digit], exactly: 2 }
                          - raw string: .
                          - { repeat: [digit], exactly: 3 }
                      - { repeat: [whitespace character], min: 2 }
                      - name: log_level
                        group:
                          - one of:
                              map: { constant: log levels }
                              through: [{ raw string: _ }]
                      - { repeat: [whitespace character], min: 1 }
                      - name: module
                        group:
                          - { repeat: [word character], min: 1 }
                          - repeat:
                              - character
                              - { repeat: [word character], min: 1 }
                            min: 0
                      - { repeat: [whitespace character], min: 0 }
                      - raw string: "-"
                      - { repeat: [whitespace character], min: 0 }
                      - name: message
                        group:
                          - { repeat: [{ character except from string: "([" }], min: 0 }
                      - { repeat: [whitespace character], min: 0 }
                      - repeat:
                          - { repeat: [whitespace character], min: 1 }
                          - raw string: (ERR-
                          - name: error_code
                            group:
                              - { repeat: [digit], exactly: 3 }
                          - raw string: )
                        max: 1
                      - { repeat: [whitespace character], min: 0 }
                      - repeat:
                          - raw string: "["
                          - { repeat: [whitespace character], min: 0 }
                          - name: extra_data_key
                            group:
                              - { repeat: [word character], min: 1 }
                          - { repeat: [whitespace character], min: 0 }
                          - raw string: =
                          - { repeat: [whitespace character], min: 0 }
                          - one of:
                              map:
                                - [number, digit]
                                - [word, word character]
                                - [string, non-whitespace character]
                              through:
                                - name:
                                    concat:
                                      - extra_data_value_
                                      - { from: _, at: [0] }
                                  group:
                                    - repeat:
                                        - { from: _, at: [1] }
                                      min: 1
                          - { repeat: [whitespace character], min: 0 }
                          - raw string: "]"
                        max: 1
                      - end of string
          expected:
            - groups:
                extra_data_key: user_id
                extra_data_value_number: "12345"
                log_level: INFO
                message: "User login successful "
                module: auth_service
                timestamp: 2026-08-10 14:23:45.123
              start: 0
              end: 83
            - groups:
                error_code: "502"
                extra_data_key: retry_count
                extra_data_value_number: "3"
                log_level: ERROR
                message: Connection timeout
                module: database.core
                timestamp: 2026-08-10 14:24:01.456
              start: 0
              end: 92
            - groups:
                extra_data_key: threshold
                extra_data_value_string: 85%
                log_level: WARN
                message: "Memory usage high "
                module: cache.redis
                timestamp: 2026-08-10 14:25:10.789
              start: 0
              end: 78
            - groups:
                extra_data_key: endpoint
                extra_data_value_string: /users
                log_level: DEBUG
                message: "Processing request "
                module: api.v2.handler
                timestamp: 2026-08-10 14:26:30.012
              start: 0
              end: 85
            - groups:
                error_code: "401"
                extra_data_key: user_id
                extra_data_value_word: abc123
                log_level: ERROR
                message: ERROR invalid token
                module: auth.service
                timestamp: 2026-08-10 14:27:15.678
              start: 0
              end: 93
      test match regex:
        assert equal::
          found:
            match:
              match regex:
                string: I categorically deny having triskaidekaphobia.
                regex: { constant: constructed regex }
            as: match regex result
            cases:
              - [null, null]
              - [any, { from: { constant: match regex result }, at: [groups, horror] }]
          expected: categorically
      test is match runtime regex building:
        assert equal::
          found:
            is match::
              string: I categorically deny having triskaidekaphobia.
              regex: { constant: constructed regex }
          expected: true
      test is match:
        assert equal::
          found:
            is match::
              string: I categorically deny having triskaidekaphobia.
              regex: { constant: raw regex }
          expected: true
      test from at value union:
        assert equal::
          found:
            match:
              from:
                match: { parse: { YAML: "s" } }
                cases:
                  - [number, { a: [1, 2, { b: s, t: 1 }] }]
                  - - any
                    - a:
                        - 1
                        - 2
                        - match: { parse: { YAML: "s" } }
                          cases:
                            - [number, { b: null, p: s }]
                            - [any, { b: 3, t: s }]
              at: [a, 2, b]
            cases:
              - [string, false]
              - [null, false]
              - [number, true]
          expected: true
      test flatten union:
        assert equal::
          found:
            flatten:
              match: { parse: { YAML: "[1]" } }
              cases:
                - [string, [[1, 2], [3, 4, 5]]]
                - - any
                  - - [1, a, 3]
                    - match: { parse: { YAML: "[2]" } }
                      cases:
                        - [string, [1]]
                        - [any, [b]]
                    - [5, 6]
          expected: [1, a, 3, b, 5, 6]
      test fold union:
        assert equal::
          found:
            fold:
              match: { parse: { YAML: "lalala" } }
              cases:
                - [number, [a, b, c]]
                - [any, [4, 5, 6]]
            starting with: 0
            through:
              sum:
                - constant: accumulator
                - match: current
                  cases:
                    - [number, { constant: current }]
                    - [string, 0]
          expected: 15
      test filter union:
        assert equal::
          found:
            filter:
              match: { parse: { YAML: "[1]" } }
              cases:
                - [number, [1, 2, 3]]
                - [{ array: number }, [s]]
                - [any, [1]]
            through:
              is sorted:
                - 0
                - match: _
                  cases:
                    - [number, _]
                    - [string, 0]
          expected: [s]
      test lazy object:
        assert equal::
          found:
            from:
              first:
                from:
                  filter:
                    starting with: 1
                    next: 1
                  through: false
                at: [0]
              second: 1
            at: ["second"]
          expected: 1
      test lazy tuple:
        assert equal::
          found:
            from:
              - from:
                  filter:
                    starting with: 1
                    next: 1
                  through: false
                at: [0]
              - 1
            at: [1]
          expected: 1
      test filter simple:
        assert equal::
          found:
            from:
              filter:
                starting with: 1
                next: { sum: [_, 1] }
              through: { is sorted: [5, _] }
            at: [[0, 3]]
          expected: [5, 6, 7]
      test match sequence:
        assert equal::
          found:
            match:
              starting with: 1
              next: {sum: [_, 1]}
            cases:
              - [{array: number}, true]
              - [any, false]
          expected: true
      test map union:
        assert equal::
          found:
            map:
              match: { parse: { YAML: "[1]" } }
              cases:
                - [number, [1, 2, 3]]
                - [{ array: number }, [s]]
                - [any, [1]]
            through:
              sum:
                - 1
                - match: _
                  cases:
                    - [number, _]
                    - [string, 0]
          expected: [1]
      test sum map:
        assert equal::
          found:
            sum:
              map: [1, 2, 3]
              through: { sum: [_, 1] }
          expected: 9
      test is sorted map:
        assert equal::
          found:
            is sorted:
              map: [1, 2, 3]
              through: { sum: [_, 1] }
          expected: true
      test map lazy slices intersections:
        constants:
          slice length: 4
          slices amount: 100
        compute:
          assert equal::
            found:
              constants:
                numbers:
                  map:
                    starting with: 1
                    next: { sum: [_, 1] }
                  through: { sum: [_, 2] }
              compute:
                from:
                  map:
                    starting with: 1
                    next: { sum: [_, 1] }
                  through:
                    from: { constant: numbers }
                    at: [[_, { sum: [_, { constant: slice length }] }]]
                at: [[1, { constant: slices amount }]]
            expected:
              from:
                map:
                  starting with: 4
                  next: { sum: [_, 1] }
                through:
                  from:
                    starting with: _
                    next: { sum: [_, 1] }
                  at: [[0, { constant: slice length }]]
              at: [[1, { constant: slices amount }]]
      test map lazy:
        assert equal::
          found:
            from:
              map:
                starting with: 1
                next: { sum: [_, 1] }
              through: { sum: [_, 2] }
            at: [[2, 5]]
          expected: [5, 6, 7]
      test sequence simple:
        assert equal::
          found:
            from:
              starting with: 1
              next: { sum: [_, 1] }
            at: [[0, 3]]
          expected: [1, 2, 3]
      test function as argument:
        assert equal::
          found:
            functions:
              apply::
                function:: { constant: argument }
            compute:
              apply::
                function:: { sum: [_, 1] }
                argument: 1
          expected: 2
      test override function:
        assert equal::
          found:
            functions:
              f:: _
            compute:
              functions:
                f:: { sum: [_, 1] }
              compute:
                f:: 1
          expected: 2
      test repeat:
        assert equal::
          found:
            functions:
              push back::
                flatten: [{ constant: list }, [{ constant: value }]]
              repeat::
                match: amount
                cases:
                  - [1, [{ constant: value }]]
                  - - any
                    - push back::
                        list:
                          repeat::
                            value: { constant: value }
                            amount: { sum: [{ constant: amount }, -1] }
                        value: { constant: value }
            compute:
              repeat::
                value: [1, 2]
                amount: 3
          expected: [[1, 2], [1, 2], [1, 2]]
      test heterogenous branching:
        assert equal::
          found:
            match: { is sorted: [1, 2, 3] }
            cases:
              - [true, 1]
              - [false, string]
          expected: 1
