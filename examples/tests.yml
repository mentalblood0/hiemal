functions:
  assert equal::
    match: found
    cases:
      - [{ constant: expected }, ok]
      - - any
        - error:
            expected: { constant: expected }
            found: { constant: found }
  tests report::
    match:
      filter: _
      through:
        match:
          get:
            from: _
            at: 1
        cases:
          - [ok, false]
          - [{ object: { error: any } }, true]
    as: _
    cases:
      - [[], ok]
      - [any, _]
  is match::
    match:
      match regex:
        string: { constant: string }
        regex: { constant: regex }
    cases:
      - [null, false]
      - [any, true]
