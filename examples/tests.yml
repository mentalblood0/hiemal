functions:
  assert equal::
    match: found
    cases:
      - [{ constant: expected }, ok]
      - - any
        - error:
            expected: { constant: expected }
            found: { constant: found }
  tests report::
    match:
      filter: _
      through:
        match:
          from: _
          at: [1]
        cases:
          - [ok, false]
          - [{ object: { error: any } }, true]
    as: _
    cases:
      - [[], ok]
      - [any, _]
  is match::
    match:
      match regex:
        string: { constant: string }
        regex: { constant: regex }
    cases:
      - [null, false]
      - [any, true]
  match regex all::
    map:
      starting with:
        constants:
          match regex result:
            match regex:
              string: { constant: string }
              regex: { constant: regex }
        compute:
          match: match regex result
          cases:
            - [null, null]
            - - any
              - match regex result: { constant: match regex result }
                string: { constant: string }
      next:
        match: _
        as: previous
        cases:
          - [null, null]
          - - any
            - constants:
                previous end:
                  from: { constant: previous }
                  at: [match regex result, end]
              compute:
                constants:
                  string:
                    from: { constant: previous }
                    at:
                      - string
                      - - { constant: previous end }
                        - null
                compute:
                  constants:
                    match regex result:
                      match regex:
                        string: { constant: string }
                        regex: { constant: regex } 
                  compute:
                    match: match regex result
                    cases:
                      - [null, null]
                      - - any
                        - string: { constant: string }
                          match regex result:
                            groups:
                              from: { constant: match regex result }
                              at: [groups]
                            start:
                              sum:
                                - { constant: previous end }
                                - from: { constant: match regex result }
                                  at: [start]
                            end:
                              sum:
                                - { constant: previous end }
                                - from: { constant: match regex result }
                                  at: [end]
    through:
      match: _
      cases:
        - [null, null]
        - - any
          - from: _
            at: [match regex result]
constants:
  constructed regex:
    compile regex:
      - word boundary
      - group:
          - repeat: [word character]
            exactly: 13
        name: horror
      - word boundary
  raw regex:
    compile regex: \b\w{13}\b
