functions:
  assert equal::
    match: found
    cases:
      - [{ constant: expected }, ok]
      - - any
        - error:
            expected: { constant: expected }
            found: { constant: found }
  tests report::
    match:
      filter: _
      through:
        match:
          from: _
          at: [1]
        cases:
          - [ok, false]
          - [{ object: { error: any } }, true]
    as: _
    cases:
      - [[], ok]
      - [any, _]
  is match::
    match:
      match regex:
        string: { constant: string }
        regex: { constant: regex }
    cases:
      - [null, false]
      - [any, true]
  match regex all::
    map:
      starting with:
        constants:
          match regex result:
            match regex:
              string: { constant: string }
              regex: { constant: regex }
        compute:
          match: match regex result
          cases:
            - [null, null]
            - - any
              - match regex result: { constant: match regex result }
                string: { constant: string }
      next:
        match: _
        as: previous
        cases:
          - [null, null]
          - - any
            - constants:
                previous end:
                  from: { constant: previous }
                  at: [match regex result, end]
              compute:
                constants:
                  string:
                    from: { constant: previous }
                    at:
                      - string
                      - - { constant: previous end }
                        - null
                compute:
                  constants:
                    match regex result:
                      match regex:
                        string: { constant: string }
                        regex: { constant: regex } 
                  compute:
                    match: match regex result
                    cases:
                      - [null, null]
                      - - any
                        - string: { constant: string }
                          match regex result:
                            groups:
                              from: { constant: match regex result }
                              at: [groups]
                            start:
                              sum:
                                - { constant: previous end }
                                - from: { constant: match regex result }
                                  at: [start]
                            end:
                              sum:
                                - { constant: previous end }
                                - from: { constant: match regex result }
                                  at: [end]
    through:
      match: _
      cases:
        - [null, null]
        - - any
          - from: _
            at: [match regex result]
compute:
  tests report::
    key-value pairs:
      test sequence while:
        assert equal::
          found:
            starting with: 1
            next: { sum: [_, 2] }
            while: { is sorted: [_, 5] }
          expected: [1, 3, 5]
      test flatten lazy:
        assert equal::
          found:
            from:
              flatten:
                - [1, 2]
                - starting with: 1
                  next: { sum: [_, 1] }
            at: [[0, 5]]
          expected: [1, 2, 1, 2, 3]
      test try:
        assert equal::
          found:
            try:
              - read bytes from file: tests.yml
              - read bytes from file: nonexistent file
            or: false
          expected: false
      test heterogenous sequence:
        assert equal::
          found:
            from:
              starting with: [0, 1]
              next:
                - sum:
                    - from: _
                      at: [0]
                    - 1
                - match:
                    from: _
                    at: [1]
                  cases:
                    - [number, s]
                    - [string, 1]
            at: [[0, 4]]
          expected:
            - [0, 1]
            - [1, s]
            - [2, 1]
            - [3, s]
      test FizzBuzz:
        assert equal::
          found:
            from:
              map:
                starting with: 1
                next: { sum: [_, 1] }
              through:
                match:
                  mod: [_, 3]
                cases:
                  - - 0
                    - match:
                        mod: [_, 5]
                      cases:
                        - [0, FizzBuzz]
                        - [any, Fizz]
                  - - any
                    - match:
                        mod: [_, 5]
                      cases:
                        - [0, Buzz]
                        - [any, _]
            at: [[0, 20]]
          expected: [1, 2, Fizz, 4, Buzz, Fizz, 7, 8, Fizz, Buzz, 11, Fizz, 13, 14, FizzBuzz, 16, 17, Fizz, 19, Buzz]
      test mod:
        assert equal::
          found:
            mod: [20, 6]
          expected: 2
      test match regex all:
        assert equal::
          found:
            from:
              match regex all::
                string: I categorically categorically deny having triskaidekaphobia.
                regex:
                  - word boundary
                  - group:
                      - repeat: [word character]
                        exactly: 13
                    name: horror
                  - word boundary
            at: [[0, 3]]
          expected:
            - groups:
                horror: categorically
              start: 2
              end: 15
            - groups:
                horror: categorically
              start: 16
              end: 29
            - null
      test lazy constant:
        assert equal::
          found:
            forbid:
              - read file
            compute:
              constants:
                _:
                  read bytes from file: p
              compute:
                null
          expected: null
      test from at string:
        assert equal::
          found:
            constants:
              _: abcd
            compute:
                from: _
                at: [[1, 3]]
          expected: bc
      test files:
        assert equal::
          found:
            allow:
              - error
              - create file
              - overwrite file
              - read file
              - remove file
            compute:
              pipe:
                - create file:
                    path: test files.txt
                    content: a
                - overwrite file:
                    path: test files.txt
                    content: b
                - try:
                    create file:
                      path: test files.txt
                      content: c
                  or: null
                - read bytes from file: test files.txt
                - - _
                  - remove file: test files.txt
              as: _
          expected:
            - { bytes: "62" }
            - null
      test pipe lazy:
        assert equal::
          found:
            from:
              pipe:
                - starting with: 0
                  next: { sum: [_, 1] }
                - starting with: 0
                  next: { sum: [_, { from: { constant: input }, at: [10], default: 0 }] }
                - starting with: 0
                  next: { sum: [_, { from: { constant: input }, at: [10], default: 0 }] }
              as: input
            at: [1]
          expected: 100
      test pipe:
        assert equal::
          found:
            pipe:
              - { sum: [1, 2] }
              - { sum: [_, 3] }
              - { sum: [_, 4] }
            as: _
          expected: 10
      test read from file:
        assert equal::
          found:
            - read bytes from file: .gitignore
            - string from bytes:
                match: { read bytes from file: .gitignore }
                as: _
                cases:
                  - [null, { bytes: "" }]
                  - [bytes, _]
          expected:
            - bytes: 2f7461726765740a
            - |
              /target
      test user functions caching:
        assert equal::
          found:
            functions:
              f:: { constant: _ }
            compute:
              - constants: { x: 1 }
                compute: { f:: x }
              - constants: { x: 2 }
                compute: { f:: x }
          expected: [x, x]
      test from-at array requires handling default:
        assert equal::
          found:
            match: { parse yaml: "[1]" }
            as: _
            cases:
              - - { array: number }
                - match:
                    from: _
                    at: [1]
                  cases:
                    - [number, false]
                    - [null, true]
              - [any, true]
          expected: true
      test match regex complex:
        assert equal::
          found:
            constants:
              log levels: [INFO, WARN, ERROR, DEBUG]
            compute:
              map:
                - 2026-08-10 14:23:45.123  INFO  auth_service - User login successful [user_id=12345]
                - 2026-08-10 14:24:01.456  ERROR  database.core - Connection timeout (ERR-502) [retry_count=3]
                - 2026-08-10 14:25:10.789  WARN  cache.redis - Memory usage high [threshold=85%]
                - 2026-08-10 14:26:30.012  DEBUG  api.v2.handler - Processing request [endpoint=/users]
                - 2026-08-10 14:27:15.678  ERROR  auth.service - ERROR invalid token (ERR-401) [user_id=abc123]
              through:
                match regex:
                  string: _
                  regex:
                    - start of string
                    - name: timestamp
                      group:
                        - { repeat: [digit], exactly: 4 }
                        - raw string: "-"
                        - { repeat: [digit], exactly: 2 }
                        - raw string: "-"
                        - { repeat: [digit], exactly: 2 }
                        - whitespace character
                        - { repeat: [digit], exactly: 2 }
                        - raw string: ":"
                        - { repeat: [digit], exactly: 2 }
                        - raw string: ":"
                        - { repeat: [digit], exactly: 2 }
                        - raw string: .
                        - { repeat: [digit], exactly: 3 }
                    - { repeat: [whitespace character], min: 2 }
                    - name: log_level
                      group:
                        - one of:
                            map: { constant: log levels }
                            through: [{ raw string: _ }]
                    - { repeat: [whitespace character], min: 1 }
                    - name: module
                      group:
                        - { repeat: [word character], min: 1 }
                        - repeat:
                            - character
                            - { repeat: [word character], min: 1 }
                          min: 0
                    - { repeat: [whitespace character], min: 0 }
                    - raw string: "-"
                    - { repeat: [whitespace character], min: 0 }
                    - name: message
                      group:
                        - { repeat: [{ character except from string: "([" }], min: 0 }
                    - { repeat: [whitespace character], min: 0 }
                    - repeat:
                        - { repeat: [whitespace character], min: 1 }
                        - raw string: (ERR-
                        - name: error_code
                          group:
                            - { repeat: [digit], exactly: 3 }
                        - raw string: )
                      max: 1
                    - { repeat: [whitespace character], min: 0 }
                    - repeat:
                        - raw string: "["
                        - { repeat: [whitespace character], min: 0 }
                        - name: extra_data_key
                          group:
                            - { repeat: [word character], min: 1 }
                        - { repeat: [whitespace character], min: 0 }
                        - raw string: =
                        - { repeat: [whitespace character], min: 0 }
                        - one of:
                            map:
                              - [number, digit]
                              - [word, word character]
                              - [string, non-whitespace character]
                            through:
                              - name:
                                  concat:
                                    - extra_data_value_
                                    - { from: _, at: [0] }
                                group:
                                  - repeat:
                                      - { from: _, at: [1] }
                                    min: 1
                        - { repeat: [whitespace character], min: 0 }
                        - raw string: "]"
                      max: 1
                    - end of string
          expected:
            - groups:
                extra_data_key: user_id
                extra_data_value_number: "12345"
                log_level: INFO
                message: "User login successful "
                module: auth_service
                timestamp: 2026-08-10 14:23:45.123
              start: 0
              end: 83
            - groups:
                error_code: "502"
                extra_data_key: retry_count
                extra_data_value_number: "3"
                log_level: ERROR
                message: Connection timeout
                module: database.core
                timestamp: 2026-08-10 14:24:01.456
              start: 0
              end: 92
            - groups:
                extra_data_key: threshold
                extra_data_value_string: 85%
                log_level: WARN
                message: "Memory usage high "
                module: cache.redis
                timestamp: 2026-08-10 14:25:10.789
              start: 0
              end: 78
            - groups:
                extra_data_key: endpoint
                extra_data_value_string: /users
                log_level: DEBUG
                message: "Processing request "
                module: api.v2.handler
                timestamp: 2026-08-10 14:26:30.012
              start: 0
              end: 85
            - groups:
                error_code: "401"
                extra_data_key: user_id
                extra_data_value_word: abc123
                log_level: ERROR
                message: ERROR invalid token
                module: auth.service
                timestamp: 2026-08-10 14:27:15.678
              start: 0
              end: 93
      test match regex:
        assert equal::
          found:
            match:
              match regex:
                string: I categorically deny having triskaidekaphobia.
                regex:
                  - word boundary
                  - group:
                      - repeat: [word character]
                        exactly: 13
                    name: horror
                  - word boundary
            as: match regex result
            cases:
              - [null, null]
              - [any, { from: { constant: match regex result }, at: [groups, horror] }]
          expected: categorically
      test is match runtime regex building:
        assert equal::
          found:
            is match::
              string: I categorically deny having triskaidekaphobia.
              regex:
                - word boundary
                - repeat: [word character]
                  exactly: 13
                - word boundary
          expected: true
      test is match:
        assert equal::
          found:
            is match::
              string: I categorically deny having triskaidekaphobia.
              regex: \b\w{13}\b
          expected: true
      test from at value union:
        assert equal::
          found:
            match:
              from:
                match: { parse yaml: "s" }
                cases:
                  - [number, { a: [1, 2, { b: s, t: 1 }] }]
                  - - any
                    - a:
                        - 1
                        - 2
                        - match: { parse yaml: "s" }
                          cases:
                            - [number, { b: null, p: s }]
                            - [any, { b: 3, t: s }]
              at: [a, 2, b]
            cases:
              - [string, false]
              - [null, false]
              - [number, true]
          expected: true
      test flatten union:
        assert equal::
          found:
            flatten:
              match: { parse yaml: "[1]" }
              cases:
                - [string, [[1, 2], [3, 4, 5]]]
                - - any
                  - - [1, a, 3]
                    - match: { parse yaml: "[2]" }
                      cases:
                        - [string, [1]]
                        - [any, [b]]
                    - [5, 6]
          expected: [1, a, 3, b, 5, 6]
      test fold union:
        assert equal::
          found:
            fold:
              match: { parse yaml: "lalala" }
              cases:
                - [number, [a, b, c]]
                - [any, [4, 5, 6]]
            starting with: 0
            through:
              sum:
                - constant: accumulator
                - match: current
                  cases:
                    - [number, { constant: current }]
                    - [string, 0]
          expected: 15
      test filter union:
        assert equal::
          found:
            filter:
              match: { parse yaml: "[1]" }
              cases:
                - [number, [1, 2, 3]]
                - [{ array: number }, [s]]
                - [any, [1]]
            through:
              is sorted:
                - 0
                - match: _
                  cases:
                    - [number, _]
                    - [string, 0]
          expected: [s]
      test lazy object:
        assert equal::
          found:
            from:
              first:
                from:
                  filter:
                    starting with: 1
                    next: 1
                  through: false
                at: [0]
              second: 1
            at: ["second"]
          expected: 1
      test lazy tuple:
        assert equal::
          found:
            from:
              - from:
                  filter:
                    starting with: 1
                    next: 1
                  through: false
                at: [0]
              - 1
            at: [1]
          expected: 1
      test filter simple:
        assert equal::
          found:
            from:
              filter:
                starting with: 1
                next: { sum: [_, 1] }
              through: { is sorted: [5, _] }
            at: [[0, 3]]
          expected: [5, 6, 7]
      test match sequence:
        assert equal::
          found:
            match:
              starting with: 1
              next: {sum: [_, 1]}
            cases:
              - [{array: number}, true]
              - [any, false]
          expected: true
      test map union:
        assert equal::
          found:
            map:
              match: { parse yaml: "[1]" }
              cases:
                - [number, [1, 2, 3]]
                - [{ array: number }, [s]]
                - [any, [1]]
            through:
              sum:
                - 1
                - match: _
                  cases:
                    - [number, _]
                    - [string, 0]
          expected: [1]
      test sum map:
        assert equal::
          found:
            sum:
              map: [1, 2, 3]
              through: { sum: [_, 1] }
          expected: 9
      test is sorted map:
        assert equal::
          found:
            is sorted:
              map: [1, 2, 3]
              through: { sum: [_, 1] }
          expected: true
      test map lazy slices intersections:
        constants:
          slice length: 4
          slices amount: 100
        compute:
          assert equal::
            found:
              constants:
                numbers:
                  map:
                    starting with: 1
                    next: { sum: [_, 1] }
                  through: { sum: [_, 2] }
              compute:
                from:
                  map:
                    starting with: 1
                    next: { sum: [_, 1] }
                  through:
                    from: { constant: numbers }
                    at: [[_, { sum: [_, { constant: slice length }] }]]
                at: [[1, { constant: slices amount }]]
            expected:
              from:
                map:
                  starting with: 4
                  next: { sum: [_, 1] }
                through:
                  from:
                    starting with: _
                    next: { sum: [_, 1] }
                  at: [[0, { constant: slice length }]]
              at: [[1, { constant: slices amount }]]
      test map lazy:
        assert equal::
          found:
            from:
              map:
                starting with: 1
                next: { sum: [_, 1] }
              through: { sum: [_, 2] }
            at: [[2, 5]]
          expected: [5, 6, 7]
      test sequence simple:
        assert equal::
          found:
            from:
              starting with: 1
              next: { sum: [_, 1] }
            at: [[0, 3]]
          expected: [1, 2, 3]
      test function as argument:
        assert equal::
          found:
            functions:
              apply::
                function:: { constant: argument }
            compute:
              apply::
                function:: { sum: [_, 1] }
                argument: 1
