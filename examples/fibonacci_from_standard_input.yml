functions:
  fibonacci::
    match: _
    cases:
      - [1, 1]
      - [2, 1]
      - - number
        - sum:
            - fibonacci::
                sum: [_, -1]
            - fibonacci::
                sum: [_, -2]
compute:
  fibonacci::
    match:
      parse yaml:
        string from bytes: { read bytes from standard input: all }
    as: _
    cases:
      - - number
        - _
      - - any
        - 0

