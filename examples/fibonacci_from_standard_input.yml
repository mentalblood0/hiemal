functions:
  fibonacci::
    match:
      is sorted: [_, 1]
    cases:
      - [true, _]
      - - false
        - sum:
            - fibonacci::
                sum: [_, -1]
            - fibonacci::
                sum: [_, -2]
compute:
  fibonacci::
    match:
      parse yaml: standard input
    as: _
    cases:
      - - number
        - _
      - - any
        - 0

