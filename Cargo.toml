[package]
name = "hiemal"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive", "rc"] }
serde-saphyr = { version = "0.0.28" }
anyhow = { version = "1.0", features = ["std", "backtrace"] }
ureq = { version = "3.3" }
url = { version = "2.5.8", features = ["serde"] }
dirs = "6.0.0"
glob = "0.3.3"
dashu = { version = "0.4.1", features = [
  "num-order",
  "std",
  "serde",
  "num-traits",
] }
rpds = { "version" = "1.2.1", "features" = ["std", "serde", "rayon"] }
ropey = "1.6.1"
parking_lot = { version = "0.12.5", features = [
  "hardware-lock-elision",
  "arc_lock",
] }
bincode = { version = "2.0", features = ["derive", "serde"] }
serde_with = "3.21.0"
lz4_flex = "0.13.1"
indexmap = "2.14.0"
gxhash = { version = "3.5.0", features = ["std", "deterministic"] }

[dev-dependencies]
nanorand = "0.8"
pretty_assertions = "1.4"
criterion = "0.5"

[[bench]]
name = "compute"
harness = false
