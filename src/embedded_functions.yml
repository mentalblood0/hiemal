# sum
- array: number

# mod
- tuple: [ number, number ]

# is sorted
- array: any

# read bytes from standard input
- union:
  - number
  - literal string: all

# parse yaml
- string

# key-value pairs
- generic object: any

# compile regex
- union:
  - generic literal string
  - constructed: regex

# match regex
- object:
    string: string
    regex: { embedded: compiled regex }

# concat
- array: string

# string from bytes
- bytes

# bytes from string
- string

# bufferized writer
- object:
    path: string
    mode:
      union:
      - literal string: append
      - literal string: overwrite
      - literal string: truncate
      - literal string: create or append
      - literal string: create or overwrite
      - literal string: create

# bufferized reader
- string

# write bytes
- object:
    target: { embedded: bufferized writer }
    content: bytes

# read bytes
- object:
    source: { embedded: bufferized reader }
    amount: number

# remove file
- string

# HTTP client
- array:
    union:
    - object:
        HTTPS only: bool
    - object:
        IP family:
          union:
          - literal string: IPv4
          - literal string: IPv6
          - literal string: any
    - object:
        TLS:
          array:
            union:
            - object:
                client certificate:
                  object:
                    chain:
                      array:
                        union:
                        - object:
                            DER: bytes
                        - object:
                            PEM: string
                    private key PEM: string
            - object:
                root certificates:
                  union:
                  - array:
                      union:
                      - object:
                          DER: bytes
                      - object:
                          PEM: string
                  - literal string: WebPKI
                  - literal string: platform verifier
            - object:
                use SNI: bool
    - object:
        accept:
          union: [ string, literal false ]
    - object:
        accept encoding:
          union: [ string, literal false ]
    - object: { allow non-standard methods: bool }
    - object: { error on bad status code: bool }
    - object: { input buffer size: number }
    - object: { max idle age in seconds: number }
    - object: { max idle connections: number }
    - object: { max idle connections per host: number }
    - object: { max redirects: number }
    - object: { max response header size: number }
    - object: { no delay: bool }
    - object: { output buffer size: number }
    - object:
        proxy:
          union:
          - string
          - object:
              configuration:
                array:
                  union:
                  - object: { host: string }
                  - object: { password: string }
                  - object: { port: number }
                  - object: { resolve locally: bool }
                  - object: { user name: string }
              protocol:
                union:
                - literal string: HTTP
                - literal string: HTTPS
                - literal string: SOCKS4
                - literal string: SOCKS4A
                - literal string: SOCKS5
                - literal string: SOCKS5h
          - literal false
    - object:
        redirect authorization headers:
          union:
          - literal string: never
          - literal string: same host
    - object: { timeout for await 100 in seconds: number }
    - object: { timeout for connect in seconds: number }
    - object: { timeout for receive body in seconds: number }
    - object: { timeout for resolve in seconds: number }
    - object: { timeout for send body in seconds: number }
    - object: { timeout for send request in seconds: number }
    - object: { timeout global in seconds: number }
    - object: { timeout per call in seconds: number }
    - object:
        user agent:
          union: [ string, literal false ]

# send request
- object:
    client: { embedded: HTTP client }
    request:
      object:
        URL: string
        body:
          union:
          - "null"
          - object: { data: bytes }
          - object:
              form: { generic object: string }
        method:
          union:
          - literal string: CONNECT
          - literal string: DELETE
          - literal string: GET
          - literal string: HEAD
          - literal string: OPTIONS
          - literal string: PATCH
          - literal string: POST
          - literal string: PUT
          - literal string: TRACE
        parameters:
          array:
            union:
            - object:
                content type:
                  object:
                    parameters: { generic object: string }
                    subtype: string
                    type: string
            - object:
                headers:
                  array:
                    tuple:
                    - union:
                      - literal string: accept
                      - literal string: accept-charset
                      - literal string: accept-encoding
                      - literal string: accept-language
                      - literal string: accept-ranges
                      - literal string: access-control-allow-credentials
                      - literal string: access-control-allow-headers
                      - literal string: access-control-allow-methods
                      - literal string: access-control-allow-origin
                      - literal string: access-control-expose-headers
                      - literal string: access-control-max-age
                      - literal string: access-control-request-headers
                      - literal string: access-control-request-method
                      - literal string: age
                      - literal string: allow
                      - literal string: alt-svc
                      - literal string: authorization
                      - literal string: cache-control
                      - literal string: cache-status
                      - literal string: cdn-cache-control
                      - literal string: connection
                      - literal string: content-disposition
                      - literal string: content-encoding
                      - literal string: content-language
                      - literal string: content-length
                      - literal string: content-location
                      - literal string: content-range
                      - literal string: content-security-policy
                      - literal string: content-security-policy-report-only
                      - literal string: content-type
                      - literal string: cookie
                      - literal string: date
                      - literal string: dnt
                      - literal string: etag
                      - literal string: expect
                      - literal string: expires
                      - literal string: forwarded
                      - literal string: from
                      - literal string: host
                      - literal string: if-match
                      - literal string: if-modified-since
                      - literal string: if-none-match
                      - literal string: if-range
                      - literal string: if-unmodified-since
                      - literal string: last-modified
                      - literal string: link
                      - literal string: location
                      - literal string: max-forwards
                      - literal string: origin
                      - literal string: pragma
                      - literal string: proxy-authenticate
                      - literal string: proxy-authorization
                      - literal string: public-key-pins
                      - literal string: public-key-pins-report-only
                      - literal string: range
                      - literal string: referer
                      - literal string: referrer-policy
                      - literal string: refresh
                      - literal string: retry-after
                      - literal string: sec-websocket-accept
                      - literal string: sec-websocket-extensions
                      - literal string: sec-websocket-key
                      - literal string: sec-websocket-protocol
                      - literal string: sec-websocket-version
                      - literal string: server
                      - literal string: set-cookie
                      - literal string: strict-transport-security
                      - literal string: te
                      - literal string: trailer
                      - literal string: transfer-encoding
                      - literal string: upgrade
                      - literal string: upgrade-insecure-requests
                      - literal string: user-agent
                      - literal string: vary
                      - literal string: via
                      - literal string: warning
                      - literal string: www-authenticate
                      - literal string: x-content-type-options
                      - literal string: x-dns-prefetch-control
                      - literal string: x-frame-options
                      - literal string: x-xss-protection
                    - string
            - object:
                query: { generic object: string }
            - object:
                version:
                  union:
                  - literal string: HTTP/0.9
                  - literal string: HTTP/1.0
                  - literal string: HTTP/1.1
                  - literal string: HTTP/2.0
                  - literal string: HTTP/3.0

# run
- object:
    command: string
    arguments: { array: string }
